<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="工作管理助手">
<meta name="theme-color" content="#6BB5A0">
<title>工作管理助手</title>
<link rel="manifest" href="manifest-work.json">
<style>
:root{
  --primary:#6BB5A0;
  --primary-dark:#4A9580;
  --primary-light:#A8D5C2;
  --primary-bg:#E8F5EF;
  --text:#2D3436;
  --text-sub:#636E72;
  --border:#DFE6E9;
  --bg:#F5F8F7;
  --white:#FFFFFF;
  --danger:#FF7675;
  --warning:#FDCB6E;
  --info:#74B9FF;
  --radius:12px;
  --shadow:0 2px 12px rgba(0,0,0,.06);
  --sidebar-w:220px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input,textarea,select{font-family:inherit;outline:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}
::-webkit-scrollbar-track{background:transparent}

/* ===== Layout ===== */
.app{display:flex;height:100vh;height:100dvh}

/* ===== Sidebar ===== */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  background:linear-gradient(180deg,var(--primary) 0%,var(--primary-dark) 100%);
  display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);
}
.sidebar-logo{
  padding:24px 20px 20px;color:#fff;
  font-size:18px;font-weight:700;
  display:flex;align-items:center;gap:10px;
}
.sidebar-logo .icon{font-size:24px}
.sidebar-nav{flex:1;padding:8px 0;overflow-y:auto}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:14px 20px;color:rgba(255,255,255,.8);
  font-size:14px;font-weight:500;cursor:pointer;
  transition:all .2s;border-left:3px solid transparent;
}
.nav-item:hover{background:rgba(255,255,255,.1);color:#fff}
.nav-item.active{
  background:rgba(255,255,255,.15);color:#fff;
  border-left-color:#fff;
}
.nav-item .nav-icon{font-size:20px;flex-shrink:0}

.sidebar-footer{
  padding:12px 20px calc(12px + env(safe-area-inset-bottom));
  color:rgba(255,255,255,.5);font-size:11px;text-align:center;
}

/* ===== Main Content ===== */
.content{
  flex:1;overflow-y:auto;
  padding:24px 28px;
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
}
.page{display:none;animation:fade .3s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.page-header{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:20px;flex-wrap:wrap;gap:12px;
}
.page-title{font-size:22px;font-weight:700;color:var(--text)}
.page-subtitle{font-size:13px;color:var(--text-sub);margin-top:4px}

/* ===== Buttons ===== */
.btn{
  padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;
  transition:all .2s;display:inline-flex;align-items:center;gap:6px;
}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{opacity:.85}
.btn-sm{padding:5px 12px;font-size:12px}
.btn-icon{padding:6px 8px;border-radius:6px;background:transparent;color:var(--text-sub)}
.btn-icon:hover{background:var(--primary-bg);color:var(--primary)}

/* ===== Cards ===== */
.card{
  background:var(--white);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:20px;margin-bottom:16px;
}
.card-title{font-size:16px;font-weight:600;margin-bottom:12px}

/* ===== Calendar ===== */
.calendar-header{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:16px;flex-wrap:wrap;gap:8px;
}
.calendar-nav{display:flex;align-items:center;gap:12px}
.calendar-nav h3{font-size:18px;font-weight:700;min-width:120px;text-align:center}
.calendar-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.calendar-weekdays div{text-align:center;font-size:12px;color:var(--text-sub);font-weight:600;padding:4px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day{
  min-height:80px;background:var(--white);border-radius:8px;
  border:1px solid var(--border);padding:6px 8px;
  cursor:pointer;transition:all .15s;position:relative;
  display:flex;flex-direction:column;
}
.cal-day:hover{border-color:var(--primary);box-shadow:0 2px 8px rgba(107,181,160,.15)}
.cal-day.other-month{opacity:.35}
.cal-day.today{border-color:var(--primary);border-width:2px;background:var(--primary-bg)}
.cal-day.has-schedule::after{
  content:'';position:absolute;top:6px;right:6px;
  width:7px;height:7px;background:var(--primary);border-radius:50%;
}
.cal-day-num{font-size:13px;font-weight:600;margin-bottom:2px}
.cal-schedules{flex:1;overflow:hidden;font-size:11px}
.cal-schedule-item{
  background:var(--primary-bg);color:var(--primary-dark);
  padding:1px 5px;border-radius:4px;margin-bottom:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ===== Guest ===== */
.search-bar{
  width:100%;padding:10px 16px;border:1px solid var(--border);
  border-radius:8px;font-size:13px;margin-bottom:16px;
  transition:border-color .2s;
}
.search-bar:focus{border-color:var(--primary)}
.guest-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.guest-card{
  background:var(--white);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:16px;position:relative;
  border-top:3px solid var(--primary);transition:transform .15s;
}
.guest-card:hover{transform:translateY(-2px)}
.guest-name{font-size:16px;font-weight:700;margin-bottom:8px}
.guest-info{font-size:13px;color:var(--text-sub);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.guest-info .label{color:var(--text-sub);min-width:70px;font-weight:500}
.guest-info .value{color:var(--text);word-break:break-all}
.guest-actions{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}

/* ===== Sports ===== */
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.filter-bar .filter-label{font-size:12px;color:var(--text-sub);font-weight:600;margin-right:4px;white-space:nowrap}
.filter-tab{
  padding:6px 16px;border-radius:20px;font-size:13px;font-weight:500;
  background:var(--white);border:1px solid var(--border);color:var(--text-sub);
  cursor:pointer;transition:all .2s;
}
.filter-tab:hover{border-color:var(--primary)}
.filter-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.filter-tab .badge{font-size:11px;opacity:.7;margin-left:2px}
.sports-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.sport-card{
  background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px;border-left:4px solid var(--primary);
}
.sport-card h4{font-size:15px;font-weight:600;margin-bottom:6px}
.sport-card .age-range{font-size:12px;color:var(--primary);font-weight:500;margin-bottom:8px}
.sport-card .tag-row{margin-bottom:6px;display:flex;flex-wrap:wrap;gap:4px}
.sport-card .cat-tag{
  display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;
  background:var(--primary-bg);color:var(--primary-dark);
}
.sport-card .venue-tag{
  display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;
  font-weight:500;
}
.sport-card .venue-indoor{background:#E3F2FD;color:#1976D2}
.sport-card .venue-outdoor{background:#E8F5E9;color:#388E3C}
.sport-card .equip-tag{
  display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;
  font-weight:500;
}
.sport-card .equip-none{background:#FFF3E0;color:#E65100}
.sport-card .equip-need{background:#F3E5F5;color:#7B1FA2}
.sport-card .meta-row{
  display:flex;gap:12px;flex-wrap:wrap;margin-bottom:6px;
  padding:6px 0;border-top:1px dashed var(--border);
}
.sport-card .meta-item{font-size:12px;color:var(--text-sub);display:flex;align-items:center;gap:3px}
.sport-card .meta-item .meta-icon{font-size:14px}
.sport-card .meta-item .meta-val{color:var(--text);font-weight:500}
.sport-card .desc{font-size:13px;color:var(--text-sub);line-height:1.5}

/* ===== Attractions ===== */
.attn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.attn-card{
  background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);
  overflow:hidden;transition:transform .15s;display:flex;flex-direction:column;
}
.attn-card:hover{transform:translateY(-2px)}
.attn-card-body{padding:16px;flex:1;display:flex;flex-direction:column}
.attn-card h4{font-size:16px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.attn-card .attn-tags{margin-bottom:8px}
.attn-tag{
  display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;
  background:var(--primary-bg);color:var(--primary-dark);margin-right:4px;margin-bottom:4px;
}
.attn-card .attn-meta{
  display:flex;flex-wrap:wrap;gap:8px 14px;margin-bottom:8px;
  padding:6px 0;border-top:1px dashed var(--border);border-bottom:1px dashed var(--border);
}
.attn-card .meta-item{font-size:12px;color:var(--text-sub);display:flex;align-items:center;gap:3px}
.attn-card .meta-item .meta-icon{font-size:14px}
.attn-card .meta-item .meta-val{color:var(--text);font-weight:500}
.attn-card .ticket-free{color:var(--primary-dark);font-weight:600}
.attn-card .attn-highlights{
  font-size:12px;color:var(--primary-dark);background:var(--primary-bg);
  padding:4px 8px;border-radius:6px;margin-bottom:8px;line-height:1.5;
}
.attn-card .attn-tips{
  font-size:12px;color:var(--text-sub);background:#FFF8E1;
  padding:4px 8px;border-radius:6px;margin-bottom:8px;line-height:1.5;
}
.attn-card .location{font-size:13px;color:var(--text-sub);margin-bottom:4px;display:flex;align-items:center;gap:4px}
.attn-card .age-suit{font-size:12px;color:var(--info);font-weight:500;margin-bottom:8px}
.attn-card .desc{font-size:13px;color:var(--text-sub);line-height:1.5;margin-bottom:10px}
.attn-card .attn-actions{display:flex;gap:6px;margin-top:auto}
.attn-nav-btn{
  display:inline-flex;align-items:center;gap:4px;
  padding:6px 14px;border-radius:8px;font-size:13px;font-weight:500;
  background:var(--info);color:#fff;text-decoration:none;transition:opacity .2s;
}
.attn-nav-btn:hover{opacity:.85}
.attn-card .attn-edit-actions{display:flex;gap:6px;margin-top:8px}

/* ===== Modal ===== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center;z-index:1000;
  animation:fadeBg .2s ease;
}
@keyframes fadeBg{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--white);border-radius:16px;
  width:90%;max-width:500px;max-height:90vh;overflow-y:auto;
  animation:modalIn .25s ease;
}
@keyframes modalIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.modal-header{
  padding:20px 24px 16px;font-size:17px;font-weight:700;
  border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
}
.modal-close{background:none;font-size:22px;color:var(--text-sub);line-height:1;padding:0}
.modal-body{padding:20px 24px}
.modal-footer{
  padding:16px 24px 20px;border-top:1px solid var(--border);
  display:flex;justify-content:flex-end;gap:10px;
}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--text)}
.form-label .required{color:var(--danger)}
.form-input,.form-textarea,.form-select{
  width:100%;padding:10px 14px;border:1px solid var(--border);
  border-radius:8px;font-size:14px;transition:border-color .2s;background:#fff;
}
.form-input:focus,.form-textarea:focus,.form-select:focus{border-color:var(--primary)}
.form-textarea{resize:vertical;min-height:80px}
.form-row{display:flex;gap:12px}
.form-row .form-group{flex:1}
.form-hint{font-size:12px;color:var(--text-sub);margin-top:4px}

/* ===== Schedule List in Calendar Day ===== */
.schedule-list-modal{margin-top:12px}
.sched-item{
  background:var(--primary-bg);border-radius:8px;padding:10px 12px;
  margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
}
.sched-item-content{flex:1}
.sched-item-guest{font-weight:600;font-size:13px;color:var(--primary-dark)}
.sched-item-desc{font-size:12px;color:var(--text-sub);margin-top:2px}
.sched-item-time{font-size:11px;color:var(--text-sub)}
.sched-empty{text-align:center;color:var(--text-sub);padding:20px;font-size:13px}

/* ===== Empty State ===== */
.empty-state{text-align:center;padding:40px 20px;color:var(--text-sub)}
.empty-state .icon{font-size:48px;margin-bottom:12px;opacity:.3}
.empty-state p{font-size:14px}

/* ===== Mobile ===== */
.mobile-tabbar{display:none}
@media(max-width:768px){
  .sidebar{display:none}
  .content{padding:16px;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  .mobile-tabbar{
    display:flex;position:fixed;bottom:0;left:0;right:0;
    background:var(--white);box-shadow:0 -2px 10px rgba(0,0,0,.08);
    z-index:100;padding-bottom:env(safe-area-inset-bottom);
  }
  .mobile-tab{
    flex:1;padding:10px 4px;text-align:center;
    font-size:11px;color:var(--text-sub);cursor:pointer;transition:color .2s;
  }
  .mobile-tab .tab-icon{font-size:22px;display:block;margin-bottom:2px}
  .mobile-tab.active{color:var(--primary)}
  .calendar-grid .cal-day{min-height:60px}
  .cal-schedule-item{font-size:10px}
  .page-title{font-size:18px}
  .guest-grid,.attn-grid{grid-template-columns:1fr}
  .sports-grid{grid-template-columns:1fr}
  .form-row{flex-direction:column;gap:0}
  .modal{width:95%}
}
</style>
</head>
<body>
<div class="app">
  <!-- ===== Sidebar ===== -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <span class="icon">📋</span>
      <span>工作管理助手</span>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-item active" data-page="schedule">
        <span class="nav-icon">📅</span>
        <span>工作计划排班</span>
      </div>
      <div class="nav-item" data-page="guests">
        <span class="nav-icon">👥</span>
        <span>客人统计</span>
      </div>
      <div class="nav-item" data-page="sports">
        <span class="nav-icon">⚽</span>
        <span>运动推荐</span>
      </div>
      <div class="nav-item" data-page="attractions">
        <span class="nav-icon">🏞️</span>
        <span>苏州景点</span>
      </div>
    </nav>
    <div class="sidebar-footer">v1.0 · 本地存储</div>
  </aside>

  <!-- ===== Main Content ===== -->
  <main class="content">

    <!-- ====== Page: Schedule ====== -->
    <section class="page active" id="page-schedule">
      <div class="page-header">
        <div>
          <h2 class="page-title">工作计划排班</h2>
          <p class="page-subtitle">点击日期添加排班，可关联客人并填写安排内容</p>
        </div>
      </div>
      <div class="card">
        <div class="calendar-header">
          <div class="calendar-nav">
            <button class="btn btn-outline btn-sm" onclick="changeMonth(-1)">‹ 上月</button>
            <h3 id="calMonthTitle"></h3>
            <button class="btn btn-outline btn-sm" onclick="changeMonth(1)">下月 ›</button>
          </div>
          <button class="btn btn-primary" onclick="goToToday()">今天</button>
        </div>
        <div class="calendar-weekdays">
          <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
      </div>
    </section>

    <!-- ====== Page: Guests ====== -->
    <section class="page" id="page-guests">
      <div class="page-header">
        <div>
          <h2 class="page-title">客人统计</h2>
          <p class="page-subtitle">管理客户信息，支持自定义增删改查</p>
        </div>
        <button class="btn btn-primary" onclick="openGuestModal()">+ 添加客人</button>
      </div>
      <input type="text" class="search-bar" placeholder="搜索姓名 / 小红书ID / 微信ID / 电话..." oninput="renderGuests(this.value)">
      <div class="guest-grid" id="guestGrid"></div>
    </section>

    <!-- ====== Page: Sports ====== -->
    <section class="page" id="page-sports">
      <div class="page-header">
        <div>
          <h2 class="page-title">运动推荐</h2>
          <p class="page-subtitle">适合3-12岁儿童，提升体能的运动内容库</p>
        </div>
        <button class="btn btn-primary" onclick="openSportModal()">+ 添加运动</button>
      </div>
      <div class="filter-bar" id="ageTabs"></div>
      <div class="filter-bar" id="venueTabs"></div>
      <div class="sports-grid" id="sportsGrid"></div>
    </section>

    <!-- ====== Page: Attractions ====== -->
    <section class="page" id="page-attractions">
      <div class="page-header">
        <div>
          <h2 class="page-title">苏州景点</h2>
          <p class="page-subtitle">适合3-12岁儿童的苏州景点推荐，点击导航直达目的地</p>
        </div>
        <button class="btn btn-primary" onclick="openAttnModal()">+ 添加景点</button>
      </div>
      <input type="text" class="search-bar" placeholder="搜索景点名称 / 地址 / 标签..." oninput="renderAttractions(this.value)">
      <div class="filter-bar" id="attnFilterTabs"></div>
      <div class="attn-grid" id="attnGrid"></div>
    </section>

  </main>
</div>

<!-- ===== Mobile Tab Bar ===== -->
<div class="mobile-tabbar">
  <div class="mobile-tab active" data-page="schedule">
    <span class="tab-icon">📅</span>排班
  </div>
  <div class="mobile-tab" data-page="guests">
    <span class="tab-icon">👥</span>客人
  </div>
  <div class="mobile-tab" data-page="sports">
    <span class="tab-icon">⚽</span>运动
  </div>
  <div class="mobile-tab" data-page="attractions">
    <span class="tab-icon">🏞️</span>景点
  </div>
</div>

<!-- ===== Modal Container ===== -->
<div id="modalContainer"></div>

<script>
/* ===== Storage Keys ===== */
var SK='wma_v3';
var defaultData={
  guests:[],
  schedules:{},
  sports:[],
  attractions:[],
  customSports:[],
  customAttractions:[]
};

/* ===== Preset Sports ===== */
var PRESET_SPORTS=[
  /* ===== 3-6岁 · 室内 · 无器械 ===== */
  {name:'动物模仿操',ageMin:3,ageMax:6,venue:'室内',equipment:'无器械',cat:'协调',duration:'15-20分钟',frequency:'每天1次',desc:'模仿兔子跳、大象走、螃蟹横行等各种动物动作，锻炼全身协调性和想象力，趣味性极强。'},

/* ===== Data Manager ===== */
function loadData(){
  try{
    var raw=localStorage.getItem(SK);
    if(raw){
      var d=JSON.parse(raw);
      // merge defaults
      for(var k in defaultData){if(d[k]===undefined)d[k]=defaultData[k];}
      return d;
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(defaultData));
}
function saveData(){
  try{localStorage.setItem(SK,JSON.stringify(DATA));}catch(e){alert('保存失败：'+e.message);}
}
var DATA=loadData();

// first-time init: load presets
if(DATA.sports.length===0&&DATA.customSports.length===0){
  DATA.sports=JSON.parse(JSON.stringify(PRESET_SPORTS));
  saveData();
}
// upgrade: if old preset sports lack venue field, reload presets
if(DATA.sports.length>0&&DATA.sports[0]&&!DATA.sports[0].venue){
  DATA.sports=JSON.parse(JSON.stringify(PRESET_SPORTS));
  saveData();
}
if(DATA.attractions.length===0&&DATA.customAttractions.length===0){
  DATA.attractions=JSON.parse(JSON.stringify(PRESET_ATTRACTIONS));
  saveData();
}
// upgrade: if old preset attractions lack address field, reload presets
if(DATA.attractions.length>0&&DATA.attractions[0]&&!DATA.attractions[0].address){
  DATA.attractions=JSON.parse(JSON.stringify(PRESET_ATTRACTIONS));
  saveData();
}
// ensure sports & attractions arrays are populated
function getAllSports(){
  return DATA.sports.concat(DATA.customSports||[]);
}
function getAllAttractions(){
  return DATA.attractions.concat(DATA.customAttractions||[]);
}

/* ===== Navigation ===== */
function switchPage(name){
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
  document.getElementById('page-'+name).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(function(n){
    n.classList.toggle('active',n.dataset.page===name);
  });
  document.querySelectorAll('.mobile-tab').forEach(function(t){
    t.classList.toggle('active',t.dataset.page===name);
  });
  if(name==='guests')renderGuests();
  if(name==='sports')renderSports();
  if(name==='attractions')renderAttractions();
}
document.querySelectorAll('.nav-item,.mobile-tab').forEach(function(el){
  el.addEventListener('click',function(){switchPage(el.dataset.page);});
});

/* ===== Calendar ===== */
var calDate=new Date();
function pad2(n){return n<10?'0'+n:''+n;}
function fmtDate(y,m,d){return y+'-'+pad2(m+1)+'-'+pad2(d);}
function todayStr(){
  var t=new Date();
  return fmtDate(t.getFullYear(),t.getMonth(),t.getDate());
}
function changeMonth(dir){
  calDate.setMonth(calDate.getMonth()+dir);
  renderCalendar();
}
function goToToday(){
  calDate=new Date();
  renderCalendar();
  openDayModal(todayStr());
}
function renderCalendar(){
  var y=calDate.getFullYear();
  var m=calDate.getMonth();
  document.getElementById('calMonthTitle').textContent=y+'年'+(m+1)+'月';
  var firstDay=new Date(y,m,1).getDay();
  var daysInMonth=new Date(y,m+1,0).getDate();
  var daysPrev=new Date(y,m,0).getDate();
  var grid=document.getElementById('calendarGrid');
  grid.innerHTML='';
  var today=todayStr();
  // prev month days
  for(var i=firstDay-1;i>=0;i--){
    var dp=daysPrev-i;
    var pm=m-1<0?11:m-1;
    var py=m-1<0?y-1:y;
    grid.appendChild(makeCalDay(py,pm,dp,true));
  }
  // current month
  for(var d=1;d<=daysInMonth;d++){
    grid.appendChild(makeCalDay(y,m,d,false));
  }
  // next month fill
  var total=firstDay+daysInMonth;
  var remain=(7-total%7)%7;
  for(var j=1;j<=remain;j++){
    var nm=m+1>11?0:m+1;
    var ny=m+1>11?y+1:y;
    grid.appendChild(makeCalDay(ny,nm,j,true));
  }
}
function makeCalDay(y,m,d,isOther){
  var ds=fmtDate(y,m,d);
  var div=document.createElement('div');
  div.className='cal-day';
  if(isOther)div.classList.add('other-month');
  if(ds===todayStr())div.classList.add('today');
  var scheds=DATA.schedules[ds]||[];
  if(scheds.length>0)div.classList.add('has-schedule');
  var num=document.createElement('div');
  num.className='cal-day-num';
  num.textContent=d;
  div.appendChild(num);
  var sl=document.createElement('div');
  sl.className='cal-schedules';
  scheds.slice(0,3).forEach(function(s){
    var item=document.createElement('div');
    item.className='cal-schedule-item';
    var gname=getGuestName(s.guestId);
    item.textContent=(s.time?s.time+' ':'')+(gname||s.content||'').slice(0,12);
    sl.appendChild(item);
  });
  if(scheds.length>3){
    var more=document.createElement('div');
    more.className='cal-schedule-item';
    more.style.textAlign='center';
    more.textContent='+'+(scheds.length-3)+' 更多';
    sl.appendChild(more);
  }
  div.appendChild(sl);
  div.addEventListener('click',function(){openDayModal(ds);});
  return div;
}
function getGuestName(id){

  var g=DATA.guests.find(function(x){return x.id===id;});

function quickFillSched(name){
  if(!name)return;
  var ta=document.getElementById('schedContent');
  var cur=ta.value.trim();
  // find sport to get duration & frequency
  var sp=getAllSports().find(function(x){return x.name===name;});
  var line=name;
  if(sp&&(sp.duration||sp.frequency)){
    line+=' ('+[sp.duration,sp.frequency].filter(Boolean).join(', ')+')';
  }
  ta.value=cur?cur+'\n'+line:line;
  document.getElementById('schedQuickSport').value='';
}
function quickFillAttn(name){
  if(!name)return;
  var ta=document.getElementById('schedContent');
  var cur=ta.value.trim();
  var at=getAllAttractions().find(function(x){return x.name===name;});
  var line='景点：'+name;
  if(at){
    var parts=[];
    if(at.duration)parts.push(at.duration);
    if(at.ticket)parts.push(at.ticket);
    if(parts.length)line+=' ('+parts.join(', ')+')';
    if(at.address)line+='\n地址：'+at.address;
  }
  ta.value=cur?cur+'\n'+line:line;
  document.getElementById('schedQuickAttn').value='';
}

function renderSports(){
  renderAgeTabs();

/* ===== Attractions ===== */
var currentAttnVenueFilter='all';
var currentAttnTicketFilter='all';
function renderAttnFilterTabs(){
  var tabs=document.getElementById('attnFilterTabs');
  if(!tabs)return;
  var venues=[
    {key:'all',label:'全部'},
    {key:'室内',label:'室内'},
    {key:'室外',label:'室外'}
  ];
  var tickets=[
    {key:'all',label:'全部'},
    {key:'免费',label:'免费'},
    {key:'收费',label:'收费'}
  ];
  tabs.innerHTML='';
  // venue group
  var vg=document.createElement('span');
  vg.className='filter-label';
  vg.textContent='场景';
  tabs.appendChild(vg);
  venues.forEach(function(v){
    var t=document.createElement('div');
    t.className='filter-tab'+(currentAttnVenueFilter===v.key?' active':'');
    t.textContent=v.label;
    t.onclick=function(){currentAttnVenueFilter=v.key;renderAttractions(currentAttnSearchKW);};
    tabs.appendChild(t);
  });
  var sep=document.createElement('span');
  sep.style.cssText='width:1px;height:20px;background:var(--border);margin:0 4px';
  tabs.appendChild(sep);
  var tg=document.createElement('span');
  tg.className='filter-label';
  tg.textContent='门票';
  tabs.appendChild(tg);
  tickets.forEach(function(tk){
    var t=document.createElement('div');
    t.className='filter-tab'+(currentAttnTicketFilter===tk.key?' active':'');
    t.textContent=tk.label;
    t.onclick=function(){currentAttnTicketFilter=tk.key;renderAttractions(currentAttnSearchKW);};
    tabs.appendChild(t);
  });
}
var currentAttnSearchKW='';
function renderAttractions(keyword){
  currentAttnSearchKW=keyword||'';
  renderAttnFilterTabs();
  var grid=document.getElementById('attnGrid');
  var all=getAllAttractions();
  var list=all;
  // search filter
  if(currentAttnSearchKW){
    var kw=currentAttnSearchKW.toLowerCase();
    list=list.filter(function(a){
      return (a.name||'').toLowerCase().indexOf(kw)>=0||
             (a.address||'').toLowerCase().indexOf(kw)>=0||
             (a.location||'').toLowerCase().indexOf(kw)>=0||
             (a.tags||[]).join(',').toLowerCase().indexOf(kw)>=0||
             (a.desc||'').toLowerCase().indexOf(kw)>=0;
    });
  }
  // venue filter (indoor/outdoor from tags)
  if(currentAttnVenueFilter!=='all'){
    list=list.filter(function(a){
      var tags=(a.tags||[]).join(',');
      if(currentAttnVenueFilter==='室内')return tags.indexOf('室内')>=0;
      if(currentAttnVenueFilter==='室外')return tags.indexOf('户外')>=0||tags.indexOf('室外')>=0;
      return true;
    });
  }
  // ticket filter
  if(currentAttnTicketFilter!=='all'){
    list=list.filter(function(a){
      var tk=(a.ticket||'').toLowerCase();
      if(currentAttnTicketFilter==='免费')return tk.indexOf('免费')>=0;
      if(currentAttnTicketFilter==='收费')return tk&&tk.indexOf('免费')<0;
      return true;
    });
  }
  if(list.length===0){
    grid.innerHTML='<div class="empty-state" style="grid-column:1/-1"><div class="icon">🏞️</div><p>'+(currentAttnSearchKW?'未找到匹配的景点':'暂无景点数据')+'</p></div>';
    return;
  }
  grid.innerHTML='';
  list.forEach(function(a){
    var isCustom=a.isCustom||DATA.customAttractions&&DATA.customAttractions.indexOf(a)>=0;
    var tagsHtml='';
    (a.tags||[]).forEach(function(t){
      tagsHtml+='<span class="attn-tag">'+escapeHtml(t)+'</span>';
    });
    // build meta row
    var metaHtml='';
    if(a.ticket){
      var tknCls=a.ticket.indexOf('免费')>=0?'ticket-free':'';
      metaHtml+='<div class="meta-item"><span class="meta-icon">🎫</span><span class="meta-val '+tknCls+'">'+escapeHtml(a.ticket)+'</span></div>';
    }
    if(a.duration)metaHtml+='<div class="meta-item"><span class="meta-icon">⏱️</span><span class="meta-val">'+escapeHtml(a.duration)+'</span></div>';
    if(a.bestTime)metaHtml+='<div class="meta-item"><span class="meta-icon">🌤️</span><span class="meta-val">'+escapeHtml(a.bestTime)+'</span></div>';
    // nav link
    var navUrl='';
    if(a.lat&&a.lng){
      navUrl='https://uri.amap.com/m/marker?position='+a.lng+','+a.lat+'&name='+encodeURIComponent(a.name)+'&coordinate=wgs84&callnative=1';
    }else if(a.address){
      navUrl='https://uri.amap.com/m/marker?name='+encodeURIComponent(a.name)+'&address='+encodeURIComponent(a.address)+'&callnative=1';
    }
    var card=document.createElement('div');
    card.className='attn-card';
    card.innerHTML=
      '<div class="attn-card-body">'+
        '<h4>'+escapeHtml(a.name)+
          (isCustom?'<span style="font-size:11px;color:var(--primary);font-weight:400;background:var(--primary-bg);padding:1px 6px;border-radius:8px">自定义</span>':'')+
        '</h4>'+
        '<div class="attn-tags">'+tagsHtml+'</div>'+
        (metaHtml?'<div class="attn-meta">'+metaHtml+'</div>':'')+
        (a.highlights?'<div class="attn-highlights">✨ '+escapeHtml(a.highlights)+'</div>':'')+
        '<div class="location">📍 '+escapeHtml(a.address||a.location||'')+'</div>'+
        '<div class="age-suit">适合 '+a.ageMin+'-'+a.ageMax+' 岁</div>'+
        '<div class="desc">'+escapeHtml(a.desc)+'</div>'+
        (a.tips?'<div class="attn-tips">💡 '+escapeHtml(a.tips)+'</div>':'')+
        '<div class="attn-actions">'+
          (navUrl?'<a class="attn-nav-btn" href="'+navUrl+'" target="_blank" rel="noopener">🧭 导航前往</a>':'')+
        '</div>'+
        (isCustom?'<div class="attn-edit-actions">'+
          '<button class="btn btn-outline btn-sm" onclick="openAttnModal(\''+a.id+'\')">编辑</button>'+
          '<button class="btn btn-danger btn-sm" onclick="deleteAttn(\''+a.id+'\')">删除</button>'+
        '</div>':'')+
      '</div>';
    grid.appendChild(card);
  });
}

        '</div>'+
        '<div class="form-group">'+
          '<label class="form-label">标签 <span style="color:var(--text-sub);font-weight:400">(逗号分隔)</span></label>'+
          '<input type="text" class="form-input" id="aTags" value="'+(a?(a.tags||[]).join(','):'')+'" placeholder="如：户外,亲子,免费">'+
        '</div>'+
        '<div class="form-group">'+
          '<label class="form-label">特色亮点</label>'+
          '<input type="text" class="form-input" id="aHighlights" value="'+(a?escapeHtml(a.highlights||''):'')+'" placeholder="如：音乐喷泉、环湖骑行">'+
        '</div>'+
        '<div class="form-group">'+
          '<label class="form-label">景点描述</label>'+
          '<textarea class="form-textarea" id="aDesc" placeholder="适合儿童的特点介绍">'+(a?escapeHtml(a.desc||''):'')+'</textarea>'+
        '</div>'+
        '<div class="form-group">'+
          '<label class="form-label">出行提示</label>'+
          '<textarea class="form-textarea" id="aTips" placeholder="停车、防蚊、穿着建议等">'+(a?escapeHtml(a.tips||''):'')+'</textarea>'+
        '</div>'+
      '</div>'+

    '</div>'+

function saveAttn(){
  var name=document.getElementById('aName').value.trim();
  var ageMin=parseInt(document.getElementById('aAgeMin').value);
  var ageMax=parseInt(document.getElementById('aAgeMax').value);
  var location=document.getElementById('aLocation').value.trim();
  var address=document.getElementById('aAddress').value.trim();
  var latStr=document.getElementById('aLat').value.trim();
  var lngStr=document.getElementById('aLng').value.trim();
  var ticket=document.getElementById('aTicket').value.trim();
  var duration=document.getElementById('aDuration').value.trim();
  var bestTime=document.getElementById('aBestTime').value.trim();
  var tagsStr=document.getElementById('aTags').value.trim();
  var highlights=document.getElementById('aHighlights').value.trim();
  var desc=document.getElementById('aDesc').value.trim();
  var tips=document.getElementById('aTips').value.trim();
  if(!name){alert('请填写景点名称');return;}
  if(!ageMin||!ageMax||ageMin<3||ageMax>12||ageMin>ageMax){alert('请填写正确的年龄范围(3-12)');return;}
  var tags=tagsStr?tagsStr.split(/[,，、]/).map(function(t){return t.trim();}).filter(Boolean):[];
  var lat=latStr?parseFloat(latStr):null;
  var lng=lngStr?parseFloat(lngStr):null;
  var obj={id:editingAttnId||('a_'+Date.now()),name:name,location:location,address:address,lat:lat,lng:lng,ageMin:ageMin,ageMax:ageMax,ticket:ticket,duration:duration,bestTime:bestTime,highlights:highlights,desc:desc,tips:tips,tags:tags,isCustom:true};
  if(!DATA.customAttractions)DATA.customAttractions=[];
  if(editingAttnId){
    var idx=DATA.customAttractions.findIndex(function(x){return x.id===editingAttnId;});
    if(idx>=0)DATA.customAttractions[idx]=obj;
  }else{
    DATA.customAttractions.push(obj);
  }
  saveData();
  closeModal();
  renderAttractions(currentAttnSearchKW);
}
function deleteAttn(id){
  if(!confirm('确认删除这个景点吗？'))return;
  if(DATA.customAttractions){
    DATA.customAttractions=DATA.customAttractions.filter(function(a){return a.id!==id;});
    saveData();
    renderAttractions();
  }
}

/* ===== Utils ===== */
function closeModal(){
  document.getElementById('modalContainer').innerHTML='';
}
function escapeHtml(str){
  if(str===null||str===undefined)return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')closeModal();
});
